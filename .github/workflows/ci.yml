#
# Build the bridge against the cor stack, check it still satisfies the bridge contract, and run its
# functional tests against a broker built from the same stack and a mock AAS server.
#
# The job runs inside the cor stack's CI base image - the image coraine's own CI uses - and the repos
# are SIBLINGS, as on a workstation: this one in stack/<repo>, corLibs' bootstrap.sh clones the cor
# libs beside it, coraine is checked out beside them. The tests need no database server: the broker
# runs on ramDB.
#
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    #
    # Pinned, as in coraine's ci.yml (the same tag): a red run is then a change in this repo, not in the
    # image. It has libssl-dev (the broker's TLS) and python3, which the mock server needs.
    #
    container:
      image: quay.io/seamware/coraine-ci:2026-10-13-f4804c2

    env:
      SEAMWARE_PLUGIN_DIR: /opt/seamware/plugins

    #
    # A real AAS server for aas_basyx and aas_basyx_push (the rest run on the mock, FA³ST runs in the job - below):
    # Eclipse BaSyx's AAS environment, reached as http://basyx:8081 from the job's container. Its Operation
    # delegation goes to the test's delegate in the job's container - a private address, which BaSyx refuses
    # unless told otherwise. Its events (the mqtt feature) go to the MQTT broker "mqtt": eclipse-mosquitto 1.6,
    # anonymous on every interface with no configuration (a service gets no file). BaSyx connects at its start
    # and does not start without the broker: the broker first, and BaSyx restarted should it start before it
    #
    services:
      mqtt:
        image: eclipse-mosquitto:1.6
      basyx:
        image: eclipsebasyx/aas-environment:2.0.0-milestone-16
        options: --restart on-failure:10
        env:
          BASYX_SUBMODELREPOSITORY_FEATURE_OPERATION_DELEGATION_SECURITY_DENYPRIVATETARGETS: "false"
          BASYX_FEATURE_MQTT_ENABLED: "true"
          MQTT_CLIENTID: aas-test-basyx
          MQTT_HOSTNAME: mqtt
          MQTT_PORT: "1883"

    steps:
      - name: The openssl tool - the test makes the mock server's certificate
        run: command -v openssl || (apt-get update -qq && apt-get install -y -qq openssl)

      - name: Check out this bridge
        uses: actions/checkout@v4
        with:
          path: stack/bridge

      - name: Check out corLibs
        uses: actions/checkout@v4
        with:
          repository: SEAMWARE/corLibs
          path: stack/corLibs

      - name: Check out coraine
        uses: actions/checkout@v4
        with:
          repository: SEAMWARE/coraine
          path: stack/coraine

      - name: Clone and build the cor libs
        working-directory: stack/corLibs
        run: ./bootstrap.sh

      #
      # Seconds, and first: it names a broken contract as such, before the full build can fail on it
      #
      - name: Bridge contract check
        working-directory: stack/bridge
        run: make contract

      - name: Build the bridge - release, then debug
        working-directory: stack/bridge
        run: |
          make BUILD=release
          make clean
          make

      - name: Build and install coraine
        working-directory: stack/coraine
        run: |
          mkdir -p /opt/seamware/plugins /opt/seamware/etc
          make di

      #
      # FA³ST Service for aas_faaast and aas_faaast_push: its release's starter jar, run by the test in the job
      # (corTest's -faaast, $AAS_FAAAST_JAR) - FA³ST takes its MQTT message bus from a configuration file only
      # (not from its environment), and a service gets no file
      #
      - name: FA³ST's starter jar, cached
        uses: actions/cache@v4
        with:
          path: ~/faaast
          key: faaast-starter-1.3.0

      - name: FA³ST - java, its starter jar
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jre-headless > /dev/null
          mkdir -p ~/faaast
          [ -s ~/faaast/starter-1.3.0.jar ] || curl -sfL -o ~/faaast/starter-1.3.0.jar \
            https://github.com/FraunhoferIOSB/FAAAST-Service/releases/download/v1.3.0/starter-1.3.0.jar
          ls -la ~/faaast/starter-1.3.0.jar
          java -version

      - name: Functional tests
        working-directory: stack/bridge
        #
        # corTest sorts JSON bodies with the corJson tool and refuses to run without it: built with corJson,
        # not on PATH here (as in coraine's ci.yml)
        #
        env:
          CORJSON: ${{ github.workspace }}/stack/corJson/bin/corJson
          AAS_BASYX_URL: http://basyx:8081
          AAS_BASYX_MQTT_URL: mqtt://mqtt:1883
        run: AAS_FAAAST_JAR=$HOME/faaast/starter-1.3.0.jar make test CORTEST=../corLibs/bin/corTest

      - name: Keep what a failing test left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functests
          path: |
            stack/bridge/test/funcTests/cases/*.out
            stack/bridge/test/funcTests/cases/*.diff
            stack/bridge/test/funcTests/cases/*.stderr
            /tmp/aas-bridge-test/broker.log
            /tmp/aas-bridge-test/delegate.log
